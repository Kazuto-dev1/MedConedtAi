version: "3.8"

# Deploy do MedConecta AI em Docker Swarm + Traefik.
# Publicado em https://medconectai.aquacode.dev.br
#
# Pre-requisitos na VPS:
#   docker network create --driver overlay --attachable medconecta_net
#   docker service update --network-add medconecta_net traefik_traefik
#   export JWT_SECRET="..."
#   docker stack deploy -c stack.yml medconecta
#
# Conteudo servido: /opt/medconecta/web (build de web/dist)
# Config do nginx: /opt/medconecta/nginx.conf (proxy /api/ -> medconecta_api:3000)

networks:
  medconecta_net:
    external: true
    name: medconecta_net

services:
  api:
    image: medconecta-api:latest
    environment:
      PORT: "3000"
      SQLITE_PATH: /db/sqlite/medconecta.dev.sqlite
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio}
      JWT_EXPIRES_IN: 1h
    volumes:
      - medconecta_db:/db/sqlite
    networks:
      - medconecta_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        - traefik.enable=false

  web:
    image: nginx:alpine
    volumes:
      - /opt/medconecta/web:/usr/share/nginx/html:ro
      - /opt/medconecta/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - medconecta_net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.swarm.network=medconecta_net
        - traefik.http.routers.medconecta.rule=Host(`medconectai.aquacode.dev.br`)
        - traefik.http.routers.medconecta.entrypoints=websecure
        - traefik.http.routers.medconecta.tls.certresolver=le
        - traefik.http.services.medconecta.loadbalancer.server.port=80

volumes:
  medconecta_db:
